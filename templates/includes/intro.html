{% load static %}

<!--start intro section-->
<section class="intro">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-6">
                <div class="intro-content">
                    <div class="intro-badge mb-3">
                        <span>بهترین خدمات اجاره خودرو</span>
                    </div>
                    <h1 class="text-white mb-4">اجاره خودرو در سراسر ایران</h1>
                    <p class="text-white mb-5">با ما به راحتی و با اطمینان خودرو مورد نظر خود را اجاره کنید. بیش از 1000 خودرو در سراسر کشور</p>
                    <div class="d-flex flex-wrap gap-3">
                        <a href="{% url 'car:car_list' %}" class="btn btn-primary btn-lg">
                            <i class="fas fa-car me-2"></i>
                            مشاهده خودروها
                        </a>
                        <a href="{% url 'car:car_list' %}" class="btn btn-outline-light btn-lg">
                            <i class="fas fa-calendar-check me-2"></i>
                            رزرو آنلاین
                        </a>
                    </div>
                    <div class="intro-stats mt-5">
                        <div class="row">
                            <div class="col-4">
                                <div class="stat-item">
                                    <h3>1000+</h3>
                                    <p>خودرو</p>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="stat-item">
                                    <h3>50+</h3>
                                    <p>شهر</p>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="stat-item">
                                    <h3>10K+</h3>
                                    <p>مشتری راضی</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="intro-image">
                    <img src="{% static 'images/hotel.svg' %}" alt="اجاره خودرو" class="img-fluid rounded shadow-lg">
                    <div class="floating-badge">
                        <i class="fas fa-star"></i>
                        <span>امتیاز 4.8 از 5</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="intro-shape"></div>
</section>
<!--end intro section-->

<style>
.intro {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    padding: 120px 0;
    position: relative;
    overflow: hidden;
}

.intro::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url("{% static 'images/pattern.png' %}") repeat;
    opacity: 0.1;
    animation: patternMove 20s linear infinite;
}

@keyframes patternMove {
    0% { background-position: 0 0; }
    100% { background-position: 100px 100px; }
}

.intro-shape {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100px;
    background: white;
    clip-path: polygon(0 100%, 100% 0, 100% 100%);
}

.intro-badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.1);
    padding: 8px 20px;
    border-radius: 30px;
    color: white;
    font-size: 0.9rem;
    backdrop-filter: blur(5px);
    animation: fadeInUp 1s ease;
}

.intro-content {
    position: relative;
    z-index: 1;
    animation: fadeInLeft 1s ease;
}

.intro-image {
    position: relative;
    z-index: 1;
    transform: translateY(20px);
    animation: float 3s ease-in-out infinite;
}

.floating-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    background: white;
    padding: 10px 20px;
    border-radius: 30px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: fadeIn 1s ease 0.5s both;
}

.floating-badge i {
    color: #f1c40f;
}

.intro-stats {
    background: rgba(255, 255, 255, 0.1);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(5px);
}

.stat-item {
    text-align: center;
    color: white;
}

.stat-item h3 {
    font-size: 2rem;
    margin-bottom: 5px;
    color: #ff6b6b;
}

.stat-item p {
    margin: 0;
    font-size: 0.9rem;
    opacity: 0.8;
}

@keyframes float {
    0% { transform: translateY(20px); }
    50% { transform: translateY(0); }
    100% { transform: translateY(20px); }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInLeft {
    from {
        opacity: 0;
        transform: translateX(-20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.btn-primary {
    background-color: #ff6b6b;
    border-color: #ff6b6b;
    transition: all 0.3s ease;
    padding: 12px 30px;
    border-radius: 30px;
}

.btn-primary:hover {
    background-color: #ff5252;
    border-color: #ff5252;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
}

.btn-outline-light {
    padding: 12px 30px;
    border-radius: 30px;
    transition: all 0.3s ease;
}

.btn-outline-light:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
}
</style>
