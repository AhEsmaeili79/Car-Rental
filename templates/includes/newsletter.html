{% load static %}

<!-- start newsletter section -->
<section class="newsletter-section">
    <div class="container">
        <div class="newsletter-wrapper">
            <div class="newsletter-content">
                <div class="newsletter-badge">
                    <i class="fas fa-envelope"></i>
                    <span>خبرنامه</span>
                </div>
                <h2 class="newsletter-title">عضویت در خبرنامه</h2>
                <p class="newsletter-subtitle">با عضویت در خبرنامه از آخرین اخبار و تخفیف‌های ویژه مطلع شوید</p>
                
                <form method="POST" action="#" class="newsletter-form">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-group">
                            <div class="input-wrapper">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" name="first_name" class="form-control" placeholder="نام" required>
                                <div class="input-border"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="input-wrapper">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" name="last_name" class="form-control" placeholder="نام خانوادگی" required>
                                <div class="input-border"></div>
                            </div>
                        </div>
                        <div class="form-group full-width">
                            <div class="input-wrapper">
                                <i class="fas fa-envelope input-icon"></i>
                                <input type="email" name="email" class="form-control" placeholder="ایمیل خود را وارد کنید" required>
                                <div class="input-border"></div>
                                <button type="submit" class="submit-btn">
                                    <i class="fas fa-paper-plane"></i>
                                    <span>عضویت</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
                
                <div class="newsletter-benefits">
                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fas fa-gift"></i>
                        </div>
                        <span>تخفیف‌های ویژه</span>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fas fa-bell"></i>
                        </div>
                        <span>اطلاع‌رسانی سریع</span>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fas fa-percent"></i>
                        </div>
                        <span>پیشنهادات خاص</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="newsletter-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
</section>
<!-- end newsletter section -->

<style>
.newsletter-section {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    padding: 80px 0;
    position: relative;
    overflow: hidden;
}

.newsletter-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url("{% static 'images/pattern-light.png' %}") repeat;
    opacity: 0.05;
    animation: patternMove 20s linear infinite;
}

@keyframes patternMove {
    0% { background-position: 0 0; }
    100% { background-position: 100px 100px; }
}

.newsletter-shapes {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
}

.shape {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    animation: float 15s infinite ease-in-out;
}

.shape-1 {
    width: 300px;
    height: 300px;
    top: -100px;
    left: -100px;
    animation-delay: 0s;
}

.shape-2 {
    width: 200px;
    height: 200px;
    bottom: -50px;
    right: -50px;
    animation-delay: 5s;
}

.shape-3 {
    width: 150px;
    height: 150px;
    top: 50%;
    left: 50%;
    animation-delay: 10s;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(10px, -10px) rotate(5deg); }
    50% { transform: translate(-5px, 5px) rotate(-5deg); }
    75% { transform: translate(-10px, -5px) rotate(5deg); }
}

.newsletter-wrapper {
    max-width: 800px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}

.newsletter-content {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(10px);
    transform: translateY(0);
    transition: transform 0.3s ease;
}

.newsletter-content:hover {
    transform: translateY(-5px);
}

.newsletter-badge {
    display: inline-flex;
    align-items: center;
    background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
    color: white;
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 0.9rem;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
    animation: badgePulse 2s infinite;
}

@keyframes badgePulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.newsletter-badge i {
    margin-left: 8px;
}

.newsletter-title {
    color: #2c3e50;
    font-size: 2rem;
    margin-bottom: 15px;
    position: relative;
    display: inline-block;
}

.newsletter-title::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 0;
    width: 50px;
    height: 3px;
    background: linear-gradient(90deg, #ff6b6b, #ff5252);
    border-radius: 3px;
    animation: underlineGrow 0.5s ease-out;
}

@keyframes underlineGrow {
    from { width: 0; }
    to { width: 50px; }
}

.newsletter-subtitle {
    color: #7f8c8d;
    font-size: 1.1rem;
    margin-bottom: 30px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.form-group {
    position: relative;
}

.form-group.full-width {
    grid-column: 1 / -1;
}

.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.input-icon {
    position: absolute;
    left: 15px;
    color: #7f8c8d;
    font-size: 1.1rem;
    transition: all 0.3s ease;
}

.input-border {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #ff6b6b, #ff5252);
    transition: width 0.3s ease;
}

.form-control {
    width: 100%;
    padding: 12px 45px 12px 15px;
    border: 2px solid #e9ecef;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background: white;
}

.form-control:focus {
    border-color: transparent;
    box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
    outline: none;
}

.form-control:focus + .input-border {
    width: 100%;
}

.form-control:focus ~ .input-icon {
    color: #ff6b6b;
    transform: scale(1.2);
}

.submit-btn {
    position: absolute;
    left: 5px;
    top: 50%;
    transform: translateY(-50%);
    background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
}

.submit-btn:hover {
    transform: translateY(-50%) scale(1.05);
    box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
}

.submit-btn i {
    font-size: 1.1rem;
}

.newsletter-benefits {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 30px;
    padding-top: 30px;
    border-top: 1px solid #e9ecef;
}

.benefit-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: #2c3e50;
    transition: all 0.3s ease;
}

.benefit-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5rem;
    box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
    transition: all 0.3s ease;
}

.benefit-item:hover {
    transform: translateY(-5px);
}

.benefit-item:hover .benefit-icon {
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
}

.benefit-item span {
    font-size: 0.9rem;
    font-weight: 500;
}

@media (max-width: 767.98px) {
    .newsletter-section {
        padding: 40px 0;
    }
    
    .newsletter-content {
        padding: 30px 20px;
    }
    
    .form-grid {
        grid-template-columns: 1fr;
    }
    
    .newsletter-benefits {
        flex-direction: column;
        gap: 20px;
    }
    
    .shape {
        display: none;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('.newsletter-form');
    const inputs = form.querySelectorAll('input');
    
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.classList.add('focused');
        });
        
        input.addEventListener('blur', function() {
            if (!this.value) {
                this.parentElement.classList.remove('focused');
            }
        });
    });
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = this.querySelector('.submit-btn');
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        submitBtn.disabled = true;
        
        // Simulate form submission
        setTimeout(() => {
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.background = 'linear-gradient(135deg, #2ecc71 0%, #27ae60 100%)';
            
            setTimeout(() => {
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i><span>عضویت</span>';
                submitBtn.style.background = 'linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%)';
                submitBtn.disabled = false;
            }, 2000);
        }, 1500);
    });
});
</script>
