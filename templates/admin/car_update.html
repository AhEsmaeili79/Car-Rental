{% extends 'base.html' %}

{% block title %}ویرایش خودرو{% endblock %}

{% block content %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    
    <div class="container mt-4">
        <h2 class="text-center mb-4">ویرایش اطلاعات خودرو</h2>
        
        <form method="post" enctype="multipart/form-data" class="car-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">نام خودرو:</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ car.name }}" required>
            </div>
            
            <div class="form-group">
                <label for="model">مدل:</label>
                <input type="text" class="form-control" id="model" name="model" value="{{ car.model }}" required>
            </div>
            
            <div class="form-group">
                <label for="daily_price">قیمت روزانه (تومان):</label>
                <input type="number" class="form-control" id="daily_price" name="daily_price" value="{{ car.daily_price }}" required>
            </div>
            
            <div class="form-group">
                <label for="description">توضیحات:</label>
                <textarea class="form-control" id="description" name="description" rows="4">{{ car.description }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="image">تصویر خودرو:</label>
                <input type="file" class="form-control-file" id="image" name="image">
                {% if car.image %}
                    <div class="mt-2">
                        <img src="{{ car.image.url }}" alt="{{ car.name }}" style="max-width: 200px;">
                    </div>
                {% endif %}
            </div>
            
            <div class="form-group text-center mt-4">
                <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
                <a href="{% url 'renter_cars' %}" class="btn btn-secondary">انصراف</a>
            </div>
        </form>
    </div>
{% endblock %}
